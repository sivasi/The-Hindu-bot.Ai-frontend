[build]
  command = "npm run build"
  publish = "dist"

# Netlify: proxy API calls so the HTTPS site never talks to plain HTTP (mixed content).
# Browser calls:  https://the-hindu-bot.netlify.app/api/...
# Netlify forwards to the GKE LoadBalancer (static IP rag-api-ip):
#   http://34.93.146.63/api/...

[[redirects]]
  from = "/api/*"
  to = "http://34.93.146.63/api/:splat"
  status = 200
  force = true
  headers = {X-From = "netlify-proxy"}
